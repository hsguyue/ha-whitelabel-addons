# White-Label API Proxy
#
# Goal: end users must NEVER see the Home Assistant web UI. Your branded App
# only needs the API (REST) and the WebSocket control channel. This nginx
# server block allows exactly those and blocks the rest with 404.
#
# Upstream `homeassistant.local.hass.io:8123` is the official, always-valid
# DNS name for the Home Assistant Core container from inside a Supervisor
# add-on on Home Assistant OS / Supervised.

server {
    listen 8080;
    server_name _;

    # --- 1) WebSocket API: the App's primary control channel ---
    # Exact match so it wins over the /api/ prefix below.
    location = /api/websocket {
        proxy_pass http://homeassistant.local.hass.io:8123;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- 2) REST API: /api/states, /api/services, /api/config, etc. ---
    location /api/ {
        proxy_pass http://homeassistant.local.hass.io:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- 3) Defence in depth: block first-run onboarding over REST ---
    location /api/onboarding {
        return 404;
    }

    # --- 4) Block everything else (the web UI: /, /lovelace, /config,
    #        /profile, /auth, /onboarding.html, static assets, ...) ---
    location / {
        return 404;
    }
}
